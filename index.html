<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Карты">
<title>Мои карты</title>
<style>
:root{--bg:#f4f4f6;--fg:#1c1c1e;--card:#fff;--mut:#6b6b70;--acc:#0a84ff;--bd:#e0e0e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111113;--fg:#f2f2f5;--card:#1e1e22;--mut:#9a9aa2;--bd:#333338}}
:root[data-theme="dark"]{--bg:#111113;--fg:#f2f2f5;--card:#1e1e22;--mut:#9a9aa2;--bd:#333338}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,system-ui,Helvetica,Arial,sans-serif;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:26px;margin:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.c{position:relative;aspect-ratio:1.5;border-radius:18px;padding:12px;display:flex;align-items:flex-end;color:#fff;font-weight:800;font-size:22px;line-height:1.1;text-transform:uppercase;letter-spacing:.4px;box-shadow:0 6px 16px rgba(0,0,0,.2);overflow:hidden;cursor:pointer;word-break:break-word;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.c::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.3),transparent 55%);pointer-events:none}
.c span{position:relative}
.star{position:absolute;top:6px;right:6px;width:36px;height:36px;padding:0;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;font-size:20px;line-height:36px;text-shadow:none}
.empty{color:var(--mut);text-align:center;margin:40px 0}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
button.del{background:transparent;color:#ff453a}
button.small{padding:8px 12px;font-size:14px}
.add{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:16px;width:100%}
.ov{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto;z-index:5}
.ov.on{display:flex}
.bc{background:#fff;border-radius:14px;padding:18px 10px;margin:auto 0;text-align:center;color:#000}
.bc svg{width:100%;height:auto;max-height:50vh}
.bc h2{margin:0 0 10px;font-size:30px;font-weight:800;text-transform:uppercase;word-break:break-word}
.row{display:flex;gap:10px;margin-top:12px}.row>*{flex:1}
input[type=text],textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);margin-bottom:10px}
textarea{min-height:90px;font-size:13px}
input[type=file]{width:100%;margin-bottom:10px;color:var(--fg)}
label{display:block;font-size:13px;color:var(--mut);margin:6px 0}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.sw i{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;color:var(--mut)}
.sw i.on{border-color:var(--fg)}
.sw i.auto{border:2px dashed var(--bd)}
.sw i.auto.on{border:3px solid var(--fg)}
.msg{font-size:14px;margin:8px 0;min-height:20px}
.msg.err{color:#ff453a}
.hr{height:1px;background:var(--bd);margin:16px 0}
</style>
</head>
<body>
<div class="top"><h1>Мои карты</h1><button class="sec small" id="bkBtn">Копия</button></div>
<div id="grid" class="grid"></div>
<div id="empty" class="empty">Пока нет карт. Нажми «Добавить карту».</div>
<button class="add" id="addBtn">+ Добавить карту</button>

<div class="ov" id="viewOv">
  <div class="bc"><h2 id="vName"></h2><svg id="vSvg"></svg></div>
  <div class="row"><button class="sec" id="vClose">Закрыть</button><button class="sec" id="vEdit">Изменить</button></div>
</div>

<div class="ov" id="formOv">
  <h1 id="fTitle">Новая карта</h1>
  <label>Название</label>
  <input type="text" id="fName" maxlength="40" placeholder="Например, Магнит">
  <label>Номер штрихкода (цифры под полосками)</label>
  <input type="text" id="fCode" inputmode="numeric" placeholder="4600000000000">
  <label>Цвет плитки</label>
  <div class="sw" id="fSw"></div>
  <div class="row"><button class="sec" id="fCancel">Отмена</button><button id="fSave">Сохранить</button></div>
  <button class="del" id="fDel" style="margin-top:10px">Удалить карту</button>
</div>

<div class="ov" id="bkOv">
  <h1>Резервная копия</h1>
  <label>Сохранить все карты в файл</label>
  <button id="bkSave">Сохранить файл копии</button>
  <div class="row"><button class="sec" id="bkCopy">Скопировать текстом</button></div>
  <div class="hr"></div>
  <label>Восстановить из файла</label>
  <input type="file" id="bkFile" accept=".json,application/json,text/plain">
  <label>или вставь текст копии сюда</label>
  <textarea id="bkText" placeholder="Текст копии"></textarea>
  <button class="sec" id="bkRestore">Восстановить из текста</button>
  <div class="msg" id="bkMsg"></div>
  <div class="row"><button class="sec" id="bkClose">Закрыть</button></div>
</div>

<script>
var KEY='cards_v1', cards=[], cur=null, editId=null, selColor=null;
var PAL=[["#ff7a59","#e5383b"],["#ffa94d","#f76707"],["#f2c14e","#d9822b"],["#51cf66","#2b8a3e"],["#20c997","#0b7285"],["#4dabf7","#1864ab"],["#748ffc","#4c4ccf"],["#b197fc","#7048e8"],["#f783ac","#c2255c"],["#868e96","#343a40"]];
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));cards=Array.isArray(d)?d:[]}catch(e){cards=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(cards));return true}catch(e){alert('Не удалось сохранить.');return false}}
var $=function(id){return document.getElementById(id)};

var C128 = "212222,222122,222221,121223,121322,131222,122213,122312,132212,221213,221312,231212,112232,122132,122231,113222,123122,123221,223211,221132,221231,213212,223112,312131,311222,321122,321221,312212,322112,322211,212123,212321,232121,111323,131123,131321,112313,132113,132311,211313,231113,231311,112133,112331,132131,113123,113321,133121,313121,211331,231131,213113,213311,213131,311123,311321,331121,312113,312311,332111,314111,221411,431111,111224,111422,121124,121421,141122,141221,112214,112412,122114,122411,142112,142211,241211,221114,413111,241112,134111,111242,121142,121241,114212,124112,124211,411212,421112,421211,212141,214121,412121,111143,111341,131141,114113,114311,411113,411311,113141,114131,311141,411131,211412,211214,211232,2331112".split(",");
var EL=["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"];
var ER=EL.map(function(s){return s.split("").map(function(c){return c==="0"?"1":"0"}).join("")});
var EG=ER.map(function(s){return s.split("").reverse().join("")});
var EPAR=["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
function eanOk(code){
  var n=code.length,s=0;
  for(var i=0;i<n-1;i++){var d=+code[i];var w=((n-1-i)%2===1)?3:1;s+=d*w}
  return (10-s%10)%10===+code[n-1];
}
function ean13Bits(c){
  var p=EPAR[+c[0]],b="101",i;
  for(i=0;i<6;i++){var d=+c[i+1];b+=(p[i]==="L"?EL[d]:EG[d])}
  b+="01010";
  for(i=7;i<13;i++)b+=ER[+c[i]];
  return b+"101";
}
function ean8Bits(c){
  var b="101",i;
  for(i=0;i<4;i++)b+=EL[+c[i]];
  b+="01010";
  for(i=4;i<8;i++)b+=ER[+c[i]];
  return b+"101";
}
function c128Bits(code){
  var digits=/^\d+$/.test(code),vals=[],start;
  if(digits&&code.length%2===0){
    start=105;
    for(var i=0;i<code.length;i+=2)vals.push(+code.substr(i,2));
  }else{
    start=104;
    for(var j=0;j<code.length;j++){
      var v=code.charCodeAt(j)-32;
      if(v<0||v>94)return null;
      vals.push(v);
    }
  }
  var sum=start;
  for(var k=0;k<vals.length;k++)sum+=vals[k]*(k+1);
  var seq=[start].concat(vals,[sum%103,106]),bits="";
  seq.forEach(function(v){
    var w=C128[v],bar=true;
    for(var q=0;q<w.length;q++){bits+=(bar?"1":"0").repeat(+w[q]);bar=!bar}
  });
  return bits;
}
function toBits(code){
  if(/^\d{13}$/.test(code)&&eanOk(code))return ean13Bits(code);
  if(/^\d{12}$/.test(code)&&eanOk(code))return ean13Bits("0"+code);
  if(/^\d{8}$/.test(code)&&eanOk(code))return ean8Bits(code);
  return c128Bits(code);
}
function barcodeSVG(svg,code){
  var bits=toBits(code);
  if(!bits)return false;
  var q=10,W=bits.length+2*q,H=120,rects="",i=0;
  while(i<bits.length){
    if(bits[i]==="1"){var j=i;while(j<bits.length&&bits[j]==="1")j++;rects+='<rect x="'+(q+i)+'" y="0" width="'+(j-i)+'" height="'+H+'"/>';i=j}else i++;
  }
  var fs=Math.min(22,Math.max(10,(W-20)/(code.length*0.62)));
  svg.setAttribute("viewBox","0 0 "+W+" "+(H+fs+14));
  svg.innerHTML='<rect width="'+W+'" height="'+(H+fs+14)+'" fill="#fff"/><g fill="#000" shape-rendering="crispEdges">'+rects+'</g><text x="'+(W/2)+'" y="'+(H+fs+4)+'" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="'+fs+'" fill="#000">'+code.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</text>';
  return true;
}
var drawBarcode=barcodeSVG;

function palIdx(c){
  if(typeof c.color==='number'&&PAL[c.color])return c.color;
  var h=0;for(var i=0;i<c.name.length;i++)h=(h*31+c.name.charCodeAt(i))%1000;
  return h%PAL.length;
}
function grad(i){return 'linear-gradient(135deg,'+PAL[i][0]+','+PAL[i][1]+')'}

function render(){
  var g=$('grid');g.innerHTML='';
  $('empty').style.display=cards.length?'none':'block';
  var list=cards.slice().sort(function(a,b){return (b.fav?1:0)-(a.fav?1:0)});
  list.forEach(function(c){
    var d=document.createElement('div');d.className='c';
    d.style.background=grad(palIdx(c));
    if(c.name.length>14)d.style.fontSize='17px';
    var s=document.createElement('span');s.textContent=c.name;d.appendChild(s);
    var st=document.createElement('button');st.className='star';st.type='button';
    st.textContent=c.fav?'\u2605':'\u2606';st.setAttribute('aria-label','Избранное');
    st.onclick=function(e){e.stopPropagation();c.fav=!c.fav;save();render()};
    d.appendChild(st);
    d.onclick=function(){openCard(c)};
    g.appendChild(d);
  });
}

function openCard(c){
  cur=c;$('vName').textContent=c.name;
  if(!drawBarcode($('vSvg'),c.code)){$('vSvg').innerHTML='';alert('Не удалось построить штрихкод из этого номера.');return}
  $('viewOv').classList.add('on');
}
$('vClose').onclick=function(){$('viewOv').classList.remove('on')};
$('vEdit').onclick=function(){$('viewOv').classList.remove('on');openForm(cur)};

function buildSw(){
  var sw=$('fSw');sw.innerHTML='';
  var a=document.createElement('i');a.className='auto';a.textContent='Авто';a.style.fontSize='11px';
  a.onclick=function(){selColor=null;markSw()};sw.appendChild(a);
  PAL.forEach(function(p,i){
    var e=document.createElement('i');e.style.background=grad(i);
    e.onclick=function(){selColor=i;markSw()};sw.appendChild(e);
  });
}
function markSw(){
  var ch=$('fSw').children;
  for(var i=0;i<ch.length;i++)ch[i].classList.toggle('on',(i===0&&selColor===null)||(i>0&&selColor===i-1));
}
function openForm(c){
  editId=c?c.id:null;
  $('fTitle').textContent=c?'Изменить карту':'Новая карта';
  $('fName').value=c?c.name:'';$('fCode').value=c?c.code:'';
  selColor=(c&&typeof c.color==='number'&&PAL[c.color])?c.color:null;
  $('fDel').style.display=c?'block':'none';
  buildSw();markSw();
  $('formOv').classList.add('on');
}
$('addBtn').onclick=function(){openForm(null)};
$('fCancel').onclick=function(){$('formOv').classList.remove('on')};
$('fDel').onclick=function(){
  var c=cards.filter(function(x){return x.id===editId})[0];
  if(c&&confirm('Удалить карту «'+c.name+'»?')){
    cards=cards.filter(function(x){return x.id!==editId});save();render();$('formOv').classList.remove('on');
  }
};
$('fSave').onclick=function(){
  var name=$('fName').value.trim(),code=$('fCode').value.replace(/\s+/g,'');
  if(!name||!code){alert('Укажи название и номер штрихкода.');return}
  if(!toBits(code)){alert('В номере допустимы только цифры и латинские буквы.');return}
  if(editId!==null){
    var c=cards.filter(function(x){return x.id===editId})[0];
    if(c){c.name=name;c.code=code;c.color=selColor}
  }else{
    cards.push({id:Date.now(),name:name,code:code,color:selColor,fav:false});
  }
  if(save()){render();$('formOv').classList.remove('on')}
};

/* ---- резервная копия ---- */
function bkMsg(t,err){var m=$('bkMsg');m.textContent=t;m.className='msg'+(err?' err':'')}
function bkData(){return JSON.stringify({app:'cards',v:3,exported:new Date().toISOString(),cards:cards},null,1)}
$('bkBtn').onclick=function(){bkMsg('');$('bkText').value='';$('bkFile').value='';$('bkOv').classList.add('on')};
$('bkClose').onclick=function(){$('bkOv').classList.remove('on')};
$('bkSave').onclick=function(){
  var data=bkData(),name='cards-backup-'+new Date().toISOString().slice(0,10)+'.json';
  try{
    var f=new File([data],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:'Резервная копия карт'}).then(function(){bkMsg('Готово.')}).catch(function(e){if(!e||e.name!=='AbortError')bkMsg('Не удалось поделиться файлом. Попробуй «Скопировать текстом».',1)});
      return;
    }
  }catch(e){}
  try{
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    a.download=name;document.body.appendChild(a);a.click();a.remove();bkMsg('Файл сохранён.');
  }catch(e){bkMsg('Не удалось сохранить файл. Попробуй «Скопировать текстом».',1)}
};
$('bkCopy').onclick=function(){
  var data=bkData(),ta=$('bkText');ta.value=data;
  try{
    navigator.clipboard.writeText(data).then(function(){bkMsg('Текст скопирован. Вставь его в заметки.')}).catch(function(){ta.select();bkMsg('Выдели текст в поле ниже и скопируй вручную.')});
  }catch(e){ta.select();bkMsg('Выдели текст в поле ниже и скопируй вручную.')}
};
function importData(text){
  var d;try{d=JSON.parse(text)}catch(e){bkMsg('Не удалось прочитать: это не копия карт.',1);return}
  var arr=Array.isArray(d)?d:(d&&d.cards);
  if(!Array.isArray(arr)){bkMsg('Не удалось прочитать: в файле нет карт.',1);return}
  var added=0;
  arr.forEach(function(x){
    if(!x||typeof x.name!=='string'||typeof x.code!=='string')return;
    var name=x.name.trim().slice(0,40),code=x.code.replace(/\s+/g,'');
    if(!name||!code||!toBits(code))return;
    if(cards.some(function(c){return c.code===code&&c.name===name}))return;
    cards.push({id:Date.now()+added+Math.floor(Math.random()*1000),name:name,code:code,color:(typeof x.color==='number'&&PAL[x.color])?x.color:null,fav:!!x.fav});
    added++;
  });
  if(added){save();render()}
  bkMsg(added?'Добавлено карт: '+added:'Новых карт не найдено, все уже есть.');
}
$('bkFile').onchange=function(){
  var f=this.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){importData(String(r.result))};r.onerror=function(){bkMsg('Не удалось открыть файл.',1)};r.readAsText(f);
};
$('bkRestore').onclick=function(){
  var t=$('bkText').value.trim();
  if(!t){bkMsg('Вставь текст копии в поле выше.',1);return}
  importData(t);
};

load();render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){try{navigator.serviceWorker.register('./sw.js').catch(function(){})}catch(e){}})}
</script>
</body>
</html>
